# Módulos activos de deposito-service.
# Lo leen los agentes (para saber qué specs aplicar) y el cargador (SPEC-06) al arrancar.
# - id: igual al nombre de la carpeta en src/modules/
# - spec: archivo de specs-v2/ que la describe
# - orden: posición dentro de su hueco del pipeline (menor = antes). Solo para extensiones.
# Para desactivar una feature: estado: inactivo. No se toca nada más.
# Las transversales (seguridad, auditoria, idempotencia) son parte del core: siempre activas.
version: 1
servicio: deposito-service

features:
  - id: registrar-deposito
    spec: 07-registrar-deposito.md
    estado: activo
    tipo: endpoint

  - id: consultar-deposito
    spec: 08-consultar-deposito.md
    estado: activo
    tipo: endpoint

  - id: historial-depositos
    spec: 09-historial-depositos.md
    estado: activo
    tipo: endpoint

  - id: limites-por-canal
    spec: 10-limites-por-canal.md
    estado: activo
    tipo: validador
    extiende: registrar-deposito
    orden: 10

  - id: conversion-moneda
    spec: 11-conversion-moneda.md
    estado: activo
    tipo: transformador
    extiende: registrar-deposito
    orden: 10

  - id: alerta-uif
    spec: 12-alerta-uif.md
    estado: activo
    tipo: post-proceso
    extiende: registrar-deposito
    orden: 10

integraciones:
  - id: billetera
    spec: 02-integraciones.md
    usado_por: [registrar-deposito, consultar-deposito, historial-depositos]
  - id: usuario
    spec: 02-integraciones.md
    usado_por: [seguridad]
